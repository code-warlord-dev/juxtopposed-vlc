name: Build Linux packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-deb-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc pkg-config git \
            libavcodec-dev libavformat-dev \
            libswscale-dev libpostproc-dev libfreetype6-dev libfribidi-dev \
            libfontconfig1-dev libxcb1-dev libx11-dev libgl1-mesa-dev \
            libvulkan-dev libva-dev libdrm-dev libarchive-dev liblua5.2-dev \
            libupnp-dev libudev-dev libchromaprint-dev protobuf-compiler \
            libprotobuf-dev libmicrodns-dev libaribb25-dev libass-dev \
            libharfbuzz-dev libxml2-dev libsqlite3-dev \
            libtag1-dev libsecret-1-dev libnotify-dev libqt6-dev \
            dpkg-dev rpm fuse libfuse2 wget zstd gettext
      - name: Build
        run: |
          meson setup build --prefix=/usr -Dtests=disabled
          ninja -C build
          rm -rf staging
          DESTDIR=$PWD/staging ninja -C build install
      - name: Build deb
        run: |
          mkdir -p staging/DEBIAN
          cat > staging/DEBIAN/control <<'CTRL'
          Package: juxtopposed-vlc
          Version: 4.0.0
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: code_warlord <code_warlord@proton.me>
          Description: VLC media player with Juxtopposed redesign (Russian UI)
          CTRL
          sed -i 's/^          //' staging/DEBIAN/control
          mkdir -p staging/usr/share/applications
          cat > staging/usr/share/applications/juxtopposed-vlc.desktop <<'DESK'
          [Desktop Entry]
          Name=Медиапроигрыватель VLC (Juxtopposed)
          GenericName=Медиапроигрыватель
          Comment=Читает, записывает и транслирует мультимедиа
          Exec=env LC_MESSAGES=ru_UA.UTF-8 /usr/bin/vlc %U
          TryExec=/usr/bin/vlc
          Icon=vlc
          Terminal=false
          Type=Application
          Categories=AudioVideo;Player;
          StartupWMClass=vlc
          DESK
          sed -i 's/^          //' staging/usr/share/applications/juxtopposed-vlc.desktop
          dpkg-deb --build staging juxtopposed-vlc_4.0.0_amd64.deb
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          APPDIR=/tmp/AppDir
          rm -rf $APPDIR
          mkdir -p $APPDIR/usr
          cp -a staging/usr/. $APPDIR/usr/
          cat > $APPDIR/AppRun <<'ARRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/lib/vlc:${LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/vlc" "$@"
          ARRUN
          sed -i 's/^          //' $APPDIR/AppRun
          chmod +x $APPDIR/AppRun
          cat > $APPDIR/juxtopposed-vlc.desktop <<'DESK'
          [Desktop Entry]
          Name=Медиапроигрыватель VLC (Juxtopposed)
          Exec=vlc %U
          Icon=vlc
          Type=Application
          Categories=AudioVideo;Player;
          DESK
          sed -i 's/^          //' $APPDIR/juxtopposed-vlc.desktop
          cp $APPDIR/juxtopposed-vlc.desktop $APPDIR/usr/share/applications/ 2>/dev/null || true
          /tmp/appimagetool $APPDIR /tmp/JuxtopposedVLC-x86_64.AppImage
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            juxtopposed-vlc_4.0.0_amd64.deb
            /tmp/JuxtopposedVLC-x86_64.AppImage

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y meson ninja-build gcc pkgconfig git \
            ffmpeg-devel freetype-devel fribidi-devel \
            fontconfig-devel libxcb-devel libX11-devel mesa-libGL-devel \
            vulkan-devel libva-devel libdrm-devel libarchive-devel lua-devel \
            libupnp-devel systemd-devel chromaprint-devel protobuf-devel \
            libmicrodns-devel aribb25-devel libass-devel harfbuzz-devel \
            libxml2-devel sqlite-devel taglib-devel libsecret-devel \
            libnotify-devel qt6-qtbase-devel rpm-build gettext
      - name: Build
        run: |
          meson setup build --prefix=/usr -Dtests=disabled
          ninja -C build
          rm -rf staging
          DESTDIR=$PWD/staging ninja -C build install
      - name: Build rpm
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar czf ~/rpmbuild/SOURCES/juxtopposed-vlc-4.0.0.tar.gz staging
          cp packaging/rpm/juxtopposed-vlc.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/juxtopposed-vlc.spec
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: ~/rpmbuild/RPMS/**/*.rpm

  build-win64:
    name: Build Windows x86_64
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: registry.videolan.org/vlc-debian-win64-posix:20260611225331
    env:
      VLC_PREBUILT_CONTRIBS_URL: https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-7ee44ffc93821fee267b5d35fa2b1719bb790880.tar.zst
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: git config --global --add safe.directory '*'
      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          extras/package/win32/build.sh -a x86_64 -p -l -m
      - name: Package zip archive
        run: |
          cd "$GITHUB_WORKSPACE"
          ls win64-meson/
          7z a -tzip -mx=9 vlc-juxtopposed-4.0.0-win64.zip win64-meson/vlc-win64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win64
          path: vlc-juxtopposed-4.0.0-win64.zip

  build-macos:
    name: Build macOS x86_64
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-13
    env:
      VLC_PREBUILT_CONTRIBS_URL: https://artifacts.videolan.org/vlc/macos-x86_64/vlc-contrib-x86_64-apple-darwin19-c4e7f2201a42fa886ee3748f8acad6f639161afd.tar.zst
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install ninja meson cmake pkg-config autoconf automake libtool \
            gettext protobuf gnu-sed coreutils
          pip3 install mako || true
      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          ./extras/package/macosx/build.sh -a x86_64 -p -i z
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: vlc-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')

    needs: [build-deb-appimage, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: VLC (Juxtopposed) 4.0.0 — русская версия
          body: |
            Медиапроигрыватель VLC 4.0.0 с редизайном Juxtopposed и **полностью русским интерфейсом** (100% перевод, 7384 сообщения).

            **Перевод интерфейса на русский язык выполнен [code-warlord-dev](https://github.com/code-warlord-dev).**

            ### Пакеты
            | Файл | Для чего |
            | --- | --- |
            | `JuxtopposedVLC-x86_64.AppImage` | любой дистрибутив Linux |
            | `juxtopposed-vlc_4.0.0_amd64.deb` | Debian, Ubuntu и производные |
            | `juxtopposed-vlc-4.0.0-1.x86_64.rpm` | Fedora, RHEL, openSUSE |
            | `juxtopposed-vlc-4.0.0-1-x86_64.pkg.tar.zst` | Arch Linux, CachyOS |

            ### Установка
            ```bash
            # Arch / CachyOS
            sudo pacman -U juxtopposed-vlc-*.pkg.tar.zst
            # Debian / Ubuntu
            sudo apt install ./juxtopposed-vlc_*.deb
            # Fedora
            sudo rpm -i juxtopposed-vlc-*.rpm
            # AppImage
            chmod +x JuxtopposedVLC-*.AppImage && ./JuxtopposedVLC-*.AppImage
            ```
          files: dist/*
